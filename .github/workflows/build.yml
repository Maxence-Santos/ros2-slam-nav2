name: Build & Unit Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install numpy

      - name: Run pure navigation geometry tests
        run: python3 tests/test_navigation_geometry.py -v

  build:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-numpy python3-pil python3-yaml \
            ros-jazzy-slam-toolbox ros-jazzy-ros-gz ros-jazzy-xacro ros-jazzy-robot-state-publisher \
            ros-jazzy-tf2-ros

      - name: Build slam_robot package
        run: |
          source /opt/ros/jazzy/setup.bash
          # Vendor slam_toolbox is large; CI builds only the application package
          colcon build --packages-select slam_robot --symlink-install --event-handlers console_direct+

      - name: Run unit tests inside workspace
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          python3 tests/test_navigation_geometry.py -v
